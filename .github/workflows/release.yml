name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-android-web:
    name: Build Windows, Android & Web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Disable Kotlin Incremental Compilation
        run: echo "kotlin.incremental=false" >> android/gradle.properties

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build Web
        run: flutter build web --release

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive Web
        shell: pwsh
        run: Compress-Archive -Path build/web/* -DestinationPath build/web-release.zip

      - name: Archive Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows-release.zip

      - name: Prepare Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item build/app/outputs/flutter-apk/app-*-release.apk staging/
          Copy-Item build/app/outputs/bundle/release/app-release.aab staging/
          Copy-Item build/web-release.zip staging/
          Copy-Item build/windows-release.zip staging/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-windows-android-web
          path: staging/*

  build-macos-ios:
    name: Build macOS & iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build macOS
        run: flutter build macos --release

      - name: Archive macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../Shiftly-macOS.zip Shiftly.app

      - name: Build iOS (No Sign)
        run: flutter build ios --release --no-codesign

      - name: Create iOS Payload
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Shiftly-iOS.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-macos-ios
          path: |
            Shiftly-macOS.zip
            Shiftly-iOS.ipa

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Archive Linux
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../Shiftly-Linux.zip *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-linux
          path: Shiftly-Linux.zip

  create-release:
    name: Create GitHub Release
    needs: [ build-windows-android-web, build-macos-ios, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Shiftly Release

            <div dir="rtl">

            **הנחיות להתקנה:**
            *   **Android:** מומלץ להוריד את קובץ ה-`app-arm64-v8a-release.apk` (מתאים לרוב המכשירים). קובץ ה-`aab` מיועד לחנות בלבד.
            *   **iOS/macOS:** האפליקציה תומכת בהתראות Foreground. ב-iOS יש להתקין באמצעות כלי פיתוח (כיוון שאין חתימה).
            *   **Desktop:** יש להוריד את קובץ ה-Zip המתאים, לחלץ ולהריץ את הקובץ המפעיל.

            </div>

          files: |
            release-assets/app-*.apk
            release-assets/app-release.aab
            release-assets/web-release.zip
            release-assets/windows-release.zip
            release-assets/Shiftly-iOS.ipa
            release-assets/Shiftly-macOS.zip
            release-assets/Shiftly-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
